services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      STATIC_DIR: /app/frontend
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  # Optional but recommended: shared conversation memory + distributed rate
  # limiting across multiple API workers.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data

volumes:
  redis-data: